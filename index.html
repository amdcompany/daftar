<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1d29" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الجملة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>دفتر الجملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one-column phone ledger. Sticky shop bar, ink-blue capital panel with ruled ledger lines, fixed bottom tabs, bottom sheets for every form. */
:root{
  --bg:#f1f2f6;
  --surface:#ffffff;
  --sunk:#e8eaf1;
  --ink:#181b29;
  --muted:#5b627e;
  --line:#dadeea;
  --accent:#2e3aae;
  --accent-ink:#ffffff;
  --accent-soft:#e6e8f8;
  --hero:#26318f;
  --hero-ink:#f4f5ff;
  --hero-muted:#c3c8f2;
  --hero-rule:rgba(255,255,255,.07);
  --hero-leader:rgba(255,255,255,.28);
  --hero-track:rgba(255,255,255,.14);
  --hero-cost:#dfe3ff;
  --hero-margin:#7fe0ad;
  --debt:#b5352b; --debt-soft:#fbe8e5;
  --paid:#1b6e46; --paid-soft:#e0f1e7;
  --warn:#8a5900; --warn-soft:#f8edd3;
  --scrim:rgba(16,18,32,.45);
  --shadow:0 12px 32px rgba(20,24,60,.12);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
  --tabh:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131b; --surface:#1a1d29; --sunk:#232736; --ink:#e8eaf3; --muted:#9ca3bd; --line:#2d3244;
    --accent:#9ba6ff; --accent-ink:#11143a; --accent-soft:#272c54;
    --hero:#1f2559; --hero-ink:#eef0ff; --hero-muted:#adb4e8; --hero-rule:rgba(255,255,255,.05); --hero-leader:rgba(255,255,255,.22);
    --hero-track:rgba(255,255,255,.12); --hero-cost:#c9cdfb; --hero-margin:#6fd7a0;
    --debt:#ff8b7e; --debt-soft:#3b2123; --paid:#6ad7a0; --paid-soft:#173226; --warn:#f2c063; --warn-soft:#3a2f17;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#1a1d29; --sunk:#232736; --ink:#e8eaf3; --muted:#9ca3bd; --line:#2d3244;
  --accent:#9ba6ff; --accent-ink:#11143a; --accent-soft:#272c54;
  --hero:#1f2559; --hero-ink:#eef0ff; --hero-muted:#adb4e8; --hero-rule:rgba(255,255,255,.05); --hero-leader:rgba(255,255,255,.22);
  --hero-track:rgba(255,255,255,.12); --hero-cost:#c9cdfb; --hero-margin:#6fd7a0;
  --debt:#ff8b7e; --debt-soft:#3b2123; --paid:#6ad7a0; --paid-soft:#173226; --warn:#f2c063; --warn-soft:#3a2f17;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:13px}
.n,.num{font-variant-numeric:tabular-nums}
b{font-weight:600}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand-txt b{font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{color:var(--muted);font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.icon-btn svg{width:20px;height:20px}

/* notices */
#notices{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
#notices:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--accent-soft);color:var(--ink)}
.notice p{margin:0;flex:1 1 220px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--debt-soft)}
.notice .acts{display:flex;gap:8px}

/* main */
.main{padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;gap:14px}
.page-h{font-family:var(--f-display);font-weight:700;font-size:24px;margin:2px 0 0;text-wrap:balance}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-h h2{margin:0;font-size:16px;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px}

/* capital hero */
.capital{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--hero-rule) 33px 34px)}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cap-top h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px}
.cap-top span{color:var(--hero-muted);font-size:13px}
.cap-line{display:flex;align-items:baseline;gap:8px}
.cap-l{color:var(--hero-muted);font-size:14px;min-width:0}
.leader{flex:1;min-width:12px;border-bottom:2px dotted var(--hero-leader);transform:translateY(-4px)}
.cap-v{font-size:clamp(22px,6.6vw,30px);font-weight:700;line-height:1.2;white-space:nowrap}
.cap-v .cur{font-size:.5em;font-weight:500;color:var(--hero-muted);margin-inline-start:4px}
.cap-line.small .cap-v{font-size:17px;color:var(--hero-margin)}
.cap-line.small .cap-v .cur{color:var(--hero-margin)}
.bar{display:flex;height:10px;border-radius:999px;background:var(--hero-track);overflow:hidden}
.bar span{display:block;height:100%}
.bar-c{background:var(--hero-cost)}
.bar-m{background:var(--hero-margin)}
.cap-foot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--hero-muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.sw-c{background:var(--hero-cost)}
.sw-m{background:var(--hero-margin)}

.debt-card{display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.debt-card .dc-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.dc-v{font-size:24px;font-weight:700;color:var(--debt);line-height:1.25}
.dc-v .cur{font-size:.55em;font-weight:500}
.chev{width:20px;height:20px;color:var(--muted);flex:none}

.rows{display:flex;flex-direction:column}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:7px;border-bottom:1px dashed var(--line)}
.rrow:last-child{border-bottom:0}
.rrow > span:first-child{color:var(--muted)}
.rrow.big > span:first-child{color:var(--ink);font-weight:600}
.rrow.big .money{font-size:22px;font-weight:700}
.rrow.debt .money,.rrow.debt > span:last-child{color:var(--debt);font-weight:700}
.rrow.paid > span:last-child{color:var(--paid);font-weight:700}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.money .cur{font-size:.82em;color:inherit;opacity:.75;margin-inline-start:3px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.prow,.srow,.pick,.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mrow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;background:none}
.rows .mrow:last-child{border-bottom:0}
.thumb{position:relative;width:52px;height:52px;border-radius:10px;background:var(--sunk);flex:none;overflow:hidden;display:grid;place-items:center}
.thumb.sm{width:40px;height:40px;border-radius:8px}
.thumb .th-ch{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.thumb.sm .th-ch{font-size:16px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-main,.s-main,.pk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.p-name,.s-main b,.pk-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-meta,.s-main small,.pk-main small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.p-qty{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 8px;border-radius:10px;background:var(--sunk);line-height:1.2}
.p-qty b{font-size:17px;font-variant-numeric:tabular-nums}
.p-qty small{font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.p-qty.low{background:var(--warn-soft);color:var(--warn)}
.p-qty.out{background:var(--debt-soft);color:var(--debt)}
.p-qty.low small,.p-qty.out small{color:inherit}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.s-amt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:600}
.s-amt.debt{color:var(--debt);font-size:17px}
.pill{font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--debt-soft);color:var(--debt);display:grid;place-items:center;font-weight:700;flex:none}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600;padding:8px 2px 0}

/* toolbar, search */
.toolbar{display:flex;gap:8px;align-items:stretch}
.toolbar .btn{flex:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font-size:16px;padding:10px 0}
.subbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.sum{font-size:13px;color:var(--muted);flex:1 1 200px}
.sum b{color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum-card{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-radius:12px;padding:12px 14px;background:var(--debt-soft);color:var(--debt);font-weight:600}
.sum-card .money{font-size:20px;font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;font-size:14.5px;white-space:nowrap;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--debt)}
.btn.danger.solid{background:var(--debt);color:var(--surface);border-color:transparent}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:16px}
.btn[disabled]{opacity:.55;cursor:default}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span:first-child,.mini > label,.mini .lab{font-size:13px;color:var(--muted);font-weight:500}
.field input,.mini input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;font-size:16px;outline:none}
.field input:focus,.mini input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[dir="ltr"]{text-align:right;font-variant-numeric:tabular-nums}
input[readonly]{background:var(--sunk)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1}
.hint{font-size:13px;color:var(--muted);margin-top:-6px}
.hint .pos{color:var(--paid);font-weight:600}
.hint .neg{color:var(--debt);font-weight:600}
.err{color:var(--debt);font-size:13.5px;font-weight:500;margin:0}
.err:empty{display:none}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:40px;border:0;background:var(--sunk);font-size:20px;font-weight:600;flex:none}
.stepper input{border:0!important;border-radius:0!important;box-shadow:none!important;text-align:center!important;padding-inline:4px!important}
.stepper.big button{width:52px}

/* sale */
.cart{display:flex;flex-direction:column;gap:10px}
.cart-empty{margin:0;padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;text-align:center}
.cline{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.cl-top{display:flex;align-items:center;gap:10px}
.cl-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.cl-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-name small{color:var(--muted);font-size:12.5px}
.cl-top .icon-btn{width:34px;height:34px}
.cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini input{padding:9px 8px}
.cline .stepper button{width:36px}
.cl-sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.lt{font-size:15.5px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.cl-warn{margin:0;font-size:12.5px;color:var(--warn);font-weight:500}
.cl-warn.bad{color:var(--debt)}
.cl-warn:empty{display:none}
.picklist{display:flex;flex-direction:column;gap:6px}
.pick{padding:8px 10px}
.pick.is-out{opacity:.55}
.pk-add{min-width:40px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;padding-inline:6px}
.pk-add svg{width:18px;height:18px}
.pad{margin:0;padding:6px 2px}
.receipt-card{background:var(--surface);border-style:dashed;border-width:1.5px}

/* empty */
.empty{text-align:center;padding:28px 18px;border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h3{margin:0;font-size:17px}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.skel{display:flex;flex-direction:column;gap:12px}
.skel div{height:84px;border-radius:var(--r);background:var(--sunk)}
.skel div:first-child{height:190px}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:0}
.tab svg{width:24px;height:24px}
.tab .ti{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ti{background:var(--accent-soft)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:600px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding-top:6px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:4px auto 0}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.35;text-wrap:balance}
.sh-head p{margin:2px 0 0}
.imgpick{display:flex;gap:14px;align-items:center}
.imgbox{width:104px;height:104px;border-radius:14px;background:var(--sunk);overflow:hidden;flex:none;display:grid;place-items:center;border:1px solid var(--line)}
.imgbox img{width:100%;height:100%;object-fit:cover}
.imgph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.imgph svg{width:28px;height:28px}
.imgacts{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.confirm{border:1px solid var(--debt-soft);background:var(--debt-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.items{width:100%;border-collapse:collapse;font-size:14px}
table.items th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;background:var(--sunk);white-space:nowrap}
table.items td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.items td.num,table.items th.num{text-align:end;white-space:nowrap}
.paylog{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.paylog div{display:flex;justify-content:space-between;gap:12px;padding-block:5px;border-bottom:1px dashed var(--line)}
.paylog div:last-child{border-bottom:0}
.info{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px;margin:0}
.big-owed{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--debt-soft);border-radius:14px;padding:14px 16px}
.big-owed span{font-size:13px;color:var(--debt);font-weight:600}
.big-owed .money{font-size:28px;font-weight:700;color:var(--debt)}

/* invoice */
.inv{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--sunk)}
.inv-top > div{display:flex;flex-direction:column;min-width:0}
.inv-buyer{font-size:18px;font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.inv .tbl-wrap{border:0;border-radius:0}
.inv-tot{padding:4px 14px 10px;border-top:1px solid var(--line)}
.items small.u{display:block;font-size:12px;color:var(--muted)}
.inv-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-acts .btn:only-child,.inv-acts .btn:nth-child(3){grid-column:1/-1}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.sec h3{margin:0;font-size:16px;font-weight:700}
.sec p{margin:0}

/* toast */
.toast{position:fixed;z-index:60;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);margin:0 auto;max-width:480px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow);text-align:center}

@media (min-width:520px){
  .capital{padding:22px 22px 18px}
}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:none}
}

<body>

<script>
(function(){
'use strict';

/* ---------- icons ---------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic = {
  search: sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  chev: sv('<path d="m15 6-6 6 6 6"/>'),
  image: sv('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>'),
  camera: sv('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  file: sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>'),
  share: sv('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/>'),
};

/* ---------- state ---------- */
const DEFAULT_CFG = { shop: 'متجري', cur: 'د.ل', low: 5, phone: '', addr: '' };
const S = {
  mode: 'loading', ready: false, dbError: false,
  products: [], sales: [], config: { ...DEFAULT_CFG },
  tab: 'home', canWrite: true, canUpload: false,
  prodQ: '', prodSort: 'name', salesF: 'all', salesQ: '', pickQ: '',
  cart: { buyer: '', paid: '', lines: [] },
  confirmSamples: false,
};
let DB = null, ASSETS = null, LOCAL = null, LS_OK = true;
let mounted = null, sheetState = null, pendingOpen = null, invEdit = null;
const LS_DATA = 'wholesale-ledger:data', LS_UI = 'wholesale-ledger:ui', LS_BAK = 'wholesale-ledger:lastBackup';
const STANDALONE = !window.claude;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
function toNum(v) {
  const s = String(v ?? '').trim()
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 1632))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 1776))
    .replace(/[٫,،]/g, '.').replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const num0 = v => { const n = toNum(v); return isNaN(n) ? 0 : n; };
function fmt(n) {
  n = r2(n);
  const frac = Math.abs(n % 1) > 0.0001;
  return n.toLocaleString('en-US', { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 });
}
const money = n => `<span class="money"><span class="n" dir="ltr">${fmt(n)}</span><span class="cur">${esc(S.config.cur)}</span></span>`;
const norm = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const prod = id => S.products.find(p => p.id === id);
function countAr(n, one, two, few, many) {
  if (n === 1) return one; if (n === 2) return two;
  if (n >= 3 && n <= 10) return n + ' ' + few;
  return n + ' ' + many;
}
const nItems = n => n ? countAr(n, 'صنف واحد', 'صنفان', 'أصناف', 'صنفاً') : 'لا أصناف';
let dtf, dayf;
try { dtf = new Intl.DateTimeFormat('ar-LY-u-nu-latn', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }); } catch (e) { dtf = new Intl.DateTimeFormat('ar', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }); }
try { dayf = new Intl.DateTimeFormat('ar-LY-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { dayf = new Intl.DateTimeFormat('ar', { weekday: 'long', day: 'numeric', month: 'long' }); }
let timef;
try { timef = new Intl.DateTimeFormat('ar-LY-u-nu-latn', { hour: 'numeric', minute: '2-digit' }); } catch (e) { timef = new Intl.DateTimeFormat('ar', { hour: 'numeric', minute: '2-digit' }); }
const fdate = t => { try { return dtf.format(new Date(t)); } catch (e) { return ''; } };
let dtfy;
try { dtfy = new Intl.DateTimeFormat('ar-LY-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { dtfy = new Intl.DateTimeFormat('ar', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
const fdateY = t => { try { return dtfy.format(new Date(t)); } catch (e) { return ''; } };
function invNo(s) {
  if (s && +s.no > 0) return +s.no;
  const asc = S.sales.slice().sort((a, b) => (a.at || 0) - (b.at || 0));
  return asc.findIndex(x => x.id === s.id) + 1;
}
function nextInvNo() { let m = S.sales.length; for (const s of S.sales) if (+s.no > m) m = +s.no; return m + 1; }
const ftime = t => { try { return timef.format(new Date(t)); } catch (e) { return ''; } };
function dayLabel(t) {
  const d = new Date(t), now = new Date();
  const k = x => x.getFullYear() + '-' + x.getMonth() + '-' + x.getDate();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (k(d) === k(now)) return 'اليوم';
  if (k(d) === k(y)) return 'أمس';
  try { return dayf.format(d); } catch (e) { return ''; }
}
const imgSrc = p => !p || !p.img ? '' : (String(p.img).startsWith('data:') ? p.img : '/_blob/' + p.img);
function thumb(p, cls = '') {
  const src = imgSrc(p);
  const ch = esc(String((p && p.name) || '؟').trim().charAt(0) || '؟');
  return `<span class="thumb ${cls}" aria-hidden="true"><span class="th-ch">${ch}</span>${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ''}</span>`;
}
const rem = s => r2((+s.total || 0) - (+s.paid || 0));
const buyerKey = s => String(s.buyer || '').trim() || 'بدون اسم';

function stats() {
  let cost = 0, sell = 0, units = 0;
  for (const p of S.products) { const q = +p.qty || 0; cost += q * (+p.cost || 0); sell += q * (+p.price || 0); units += q; }
  let total = 0, paid = 0, profit = 0, debt = 0; const debtors = {};
  for (const s of S.sales) {
    total += +s.total || 0; paid += +s.paid || 0;
    for (const it of (s.items || [])) profit += (+it.qty || 0) * ((+it.price || 0) - (+it.cost || 0));
    const rm = rem(s);
    if (rm > 0.004) {
      debt += rm; const k = buyerKey(s);
      (debtors[k] = debtors[k] || { name: k, rem: 0, n: 0 }); debtors[k].rem += rm; debtors[k].n++;
    }
  }
  return { cost, sell, margin: sell - cost, units, total, paid, profit, debt, debtors: Object.values(debtors).sort((a, b) => b.rem - a.rem) };
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
function errMsg(e) {
  if (typeof e === 'string') return e;
  const c = e && e.code;
  if (c === 'invalid_argument' && S.mode === 'db') { S.canWrite = false; mounted = null; refresh(); }
  return ({
    invalid_argument: 'لم يُحفظ التغيير: ليست لديك صلاحية التعديل في هذا الدفتر.',
    quota_exceeded: 'امتلأت مساحة التخزين. احذف بيانات قديمة ثم حاول مرة أخرى.',
    resource_exhausted: 'طلبات كثيرة في وقت قصير. انتظر لحظة ثم حاول مرة أخرى.',
    revoked: 'انقطع الوصول إلى البيانات. أعد فتح الصفحة.',
    too_large: 'الصورة كبيرة جداً. اختر صورة أصغر.',
    unsupported_type: 'نوع الصورة غير مدعوم. استخدم JPG أو PNG.',
    quota_or_state: 'امتلأت مساحة الصور. احذف صوراً غير مستخدمة ثم أعد المحاولة.',
    rate_limited: 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.',
    no_assets: 'رفع الصور غير متاح لك في هذا الدفتر.',
    local_full: 'مساحة التخزين في هذا المتصفح ممتلئة. احذف بعض الصور.',
  })[c] || 'تعذّر الحفظ. تحقّق من الاتصال ثم حاول مرة أخرى.';
}

/* ---------- storage ---------- */
async function retry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'store_unavailable')) { await new Promise(r => setTimeout(r, 300 + Math.random() * 700)); return fn(); }
    throw e;
  }
}
/* on-device storage: IndexedDB, with localStorage as fallback */
const KV = {
  db: null,
  async open() {
    if (!window.indexedDB) return false;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('wholesale-ledger', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const n of ['products', 'sales', 'config']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      return true;
    } catch (e) { this.db = null; return false; }
  },
  readAll(name) {
    return new Promise((res, rej) => {
      const out = {}; const r = this.db.transaction(name, 'readonly').objectStore(name).openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      r.onerror = () => rej(r.error);
    });
  },
  write(name, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, 'readwrite'); fn(t);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(name, key, val) { return this.write(name, t => t.objectStore(name).put(val, key)); },
  del(name, key) { return this.write(name, t => t.objectStore(name).delete(key)); },
  replaceAll(data) {
    return this.write(['products', 'sales', 'config'], t => {
      for (const n of ['products', 'sales', 'config']) t.objectStore(n).clear();
      for (const [k, v] of Object.entries(data.products || {})) t.objectStore('products').put(v, k);
      for (const [k, v] of Object.entries(data.sales || {})) t.objectStore('sales').put(v, k);
      t.objectStore('config').put(data.config || {}, 'main');
      t.objectStore('config').put({ init: Date.now() }, 'meta');
    });
  },
};
async function localPersist(col, id) {
  try {
    if (KV.db) {
      if (col === 'config') await KV.put('config', 'main', LOCAL.config);
      else if (LOCAL[col][id]) await KV.put(col, id, LOCAL[col][id]);
      else await KV.del(col, id);
    } else if (LS_OK) localStorage.setItem(LS_DATA, JSON.stringify(LOCAL));
  } catch (e) { throw { code: 'local_full' }; }
}
async function localWrite(col, id, fn) {
  fn(); syncFromLocal(); refresh();
  await localPersist(col, id);
}
const store = {
  async set(col, id, data) {
    if (S.mode === 'db') return retry(() => DB.collection(col).doc(id).set(data));
    return localWrite(col, id, () => { if (col === 'config') LOCAL.config = clone(data); else LOCAL[col][id] = clone(data); });
  },
  async update(col, id, patch) {
    if (S.mode === 'db') return retry(() => DB.collection(col).doc(id).update(patch));
    return localWrite(col, id, () => { if (LOCAL[col][id]) Object.assign(LOCAL[col][id], clone(patch)); });
  },
  async del(col, id) {
    if (S.mode === 'db') return retry(() => DB.collection(col).doc(id).delete());
    return localWrite(col, id, () => { delete LOCAL[col][id]; });
  },
};
function syncFromLocal() {
  S.products = Object.entries(LOCAL.products).map(([id, d]) => ({ ...d, id }));
  S.sales = Object.entries(LOCAL.sales).map(([id, d]) => ({ ...d, id })).sort((a, b) => (b.at || 0) - (a.at || 0));
  S.config = { ...DEFAULT_CFG, ...(LOCAL.config || {}) };
}
function toCanvas(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ code: 'img_load' }); };
    img.src = url;
  });
}
async function saveImage(canvas) {
  if (S.mode === 'db') {
    if (!ASSETS) throw { code: 'no_assets' };
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
    if (!blob) throw { code: 'img_load' };
    const up = await retry(() => ASSETS.upload(blob, { type: 'image/jpeg' }));
    return up.id;
  }
  return canvas.toDataURL('image/jpeg', KV.db ? 0.8 : 0.72);
}

/* ---------- ui prefs (this device only) ---------- */
function saveUI() { try { localStorage.setItem(LS_UI, JSON.stringify({ tab: S.tab, cart: S.cart, prodSort: S.prodSort })); } catch (e) {} }
function loadUI() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_UI) || 'null');
    if (u) {
      if (['home', 'products', 'sale', 'sales'].includes(u.tab)) S.tab = u.tab;
      if (u.cart && Array.isArray(u.cart.lines)) S.cart = { buyer: String(u.cart.buyer || ''), paid: String(u.cart.paid || ''), lines: u.cart.lines.filter(l => l && l.pid).map(l => ({ pid: String(l.pid), qty: String(l.qty ?? '1'), price: String(l.price ?? '') })) };
      if (u.prodSort) S.prodSort = u.prodSort;
    }
  } catch (e) {}
}

/* ---------- render ---------- */
let rq = 0;
function refresh() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); setTimeout(() => { if (rq) { cancelAnimationFrame(rq); rq = 0; render(); } }, 120); }

function render() {
  $('#shopName').textContent = S.config.shop || DEFAULT_CFG.shop;
  $$('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  renderNotices();
  const v = $('#view');
  if (!S.ready) { if (mounted !== 'loading') { v.innerHTML = `<div class="skel" aria-label="جارٍ فتح الدفتر"><div></div><div></div><div></div></div>`; mounted = 'loading'; } return; }
  if (mounted !== S.tab) { VIEWS[S.tab].mount(v); mounted = S.tab; }
  VIEWS[S.tab].update();
  if (pendingOpen && S.sales.some(s => s.id === pendingOpen)) { const id = pendingOpen; pendingOpen = null; openSheet('sale', id); }
  if (sheetState && SHEETS[sheetState.kind].live && !invEdit && !$('#sheet').contains(document.activeElement && document.activeElement.matches('input,select') ? document.activeElement : null)) drawSheet(true);
}

function renderNotices() {
  const box = $('#notices'); const out = [];
  if (S.dbError) out.push(`<div class="notice bad"><p>انقطع الاتصال بالبيانات. أعد فتح الصفحة لمتابعة العمل.</p></div>`);
  if (S.ready && S.mode === 'local') {

    }

  const hasSamples = S.products.some(p => p.sample) || S.sales.some(s => s.sample);

    out.push(S.confirmSamples
      ? `<div class="notice warn"><p>سيتم حذف المنتجات والمبيعات المعلَّمة «مثال» فقط. بياناتك الأخرى لن تتأثر.</p><div class="acts"><button type="button" class="btn danger solid" id="delSamplesYes">احذف الأمثلة</button><button type="button" class="btn" id="delSamplesNo">إلغاء</button></div></div>`
      : `<div class="notice"><p>هذه بيانات <b>مثال</b> لتجربة المنظومة. احذفها عندما تبدأ بإدخال بضاعتك${STANDALONE && S.mode === 'local' ? '، أو استورد نسختك الاحتياطية' : ''}.</p><div class="acts"><button type="button" class="btn" id="delSamples">حذف بيانات المثال</button>${STANDALONE && S.mode === 'local' ? `<label class="btn" for="bkImportN">استيراد نسخة</label><input type="file" id="bkImportN" accept=".json,application/json" class="vh">` : ''}</div></div>`);
  }
  const html = out.join('');
  if (box.innerHTML !== html) box.innerHTML = html;

      <p class="cl-warn" id="w_${id}"></p>
    </div>`;
  }).join('');
  L.forEach(renderLineCalc);
}
function lineIssue(l) {
  const p = prod(l.pid); const q = toNum(l.qty), pr = toNum(l.price);
  if (!p) return { bad: true, msg: 'هذا المنتج حُذف من المخزن. أزله من البيع.' };
  if (isNaN(q) || q <= 0) return { bad: true, msg: 'اكتب كمية أكبر من صفر.' };
  if (q > (+p.qty || 0) + 1e-9) return { bad: true, msg: `الكمية أكبر من المتوفر في المخزن (${fmt(p.qty)}).` };
  if (isNaN(pr) || pr < 0) return { bad: true, msg: 'اكتب سعر الوحدة.' };
  if (pr < (+p.cost || 0)) return { bad: false, msg: 'تنبيه: سعر البيع أقل من سعر التكلفة.' };
  return null;
}
function renderLineCalc(l) {
  const lt = document.getElementById('lt_' + l.pid), w = document.getElementById('w_' + l.pid);
  if (lt) lt.innerHTML = money(num0(l.qty) * num0(l.price));
  if (w) { const iss = lineIssue(l); w.textContent = iss ? iss.msg : ''; w.classList.toggle('bad', !!(iss && iss.bad)); }
}
function cartTotals() {
  let total = 0, profit = 0;
  for (const l of S.cart.lines) { const p = prod(l.pid); const q = num0(l.qty), pr = num0(l.price); total += q * pr; profit += q * (pr - (p ? +p.cost || 0 : 0)); }
  total = r2(total); const paid = r2(num0(S.cart.paid));
  return { total, profit: r2(profit), paid, rem: r2(total - paid) };
}
function renderTotals() {
  if (!$('#tTotal')) return;
  const t = cartTotals();
  $('#tTotal').innerHTML = money(t.total);
  $('#tProfit').innerHTML = money(t.profit);
  const row = $('#tRemRow');
  row.classList.toggle('debt', Math.abs(t.rem) > 0.004); row.classList.toggle('paid', t.rem <= 0.004 && t.total > 0);
  $('#tRem').innerHTML = t.rem < -0.004 ? '<span>المدفوع أكبر من الإجمالي</span>' : (t.rem > 0.004 ? money(t.rem) : (t.total > 0 ? 'خالص' : money(0)));
}
function addToCart(pid) {
  const p = prod(pid); if (!p) return;
  const l = S.cart.lines.find(x => x.pid === pid);
  if (l) l.qty = String(r2(num0(l.qty) + 1));
  else S.cart.lines.push({ pid, qty: '1', price: String(+p.price || 0) });
  $('#saleErr').textContent = '';
  renderCart(); renderPick(); renderTotals(); saveUI();
}
async function submitSale() {
  const err = $('#saleErr'); err.textContent = '';
  const buyer = String(S.cart.buyer || '').trim();
  if (!buyer) { err.textContent = 'اكتب اسم المشتري.'; $('#buyer').focus(); return; }
  if (!S.cart.lines.length) { err.textContent = 'أضف صنفاً واحداً على الأقل.'; return; }
  for (const l of S.cart.lines) { const iss = lineIssue(l); if (iss && iss.bad) { err.textContent = (prod(l.pid) ? prod(l.pid).name + ': ' : '') + iss.msg; return; } }
  const t = cartTotals();
  const paidRaw = String(S.cart.paid || '').trim();
  if (paidRaw && (isNaN(toNum(paidRaw)) || toNum(paidRaw) < 0)) { err.textContent = 'اكتب المبلغ المدفوع بالأرقام.'; return; }
  if (t.paid > t.total + 0.004) { err.textContent = 'المبلغ المدفوع أكبر من إجمالي الفاتورة.'; return; }
  const now = Date.now();
  const items = S.cart.lines.map(l => { const p = prod(l.pid); return { pid: l.pid, name: p.name, unit: p.unit || '', qty: r2(num0(l.qty)), price: r2(num0(l.price)), cost: r2(+p.cost || 0) }; });
  const sale = { no: nextInvNo(), buyer, items, total: t.total, paid: t.paid, payments: t.paid > 0 ? [{ amt: t.paid, at: now }] : [], at: now };
  const id = newId('s_');
  const btn = $('#submitSale'); btn.disabled = true; btn.textContent = 'جارٍ التسجيل…';
  try {
    await store.set('sales', id, sale);
    for (const it of items) { const p = prod(it.pid); if (p) await store.update('products', p.id, { qty: r2((+p.qty || 0) - it.qty) }); }
    S.cart = { buyer: '', paid: '', lines: [] }; S.pickQ = ''; saveUI();
    mounted = null; refresh();
    toast(t.rem > 0.004 ? `سُجّل البيع. باقي على ${buyer}: ${fmt(t.rem)} ${S.config.cur}` : `سُجّل البيع لـ ${buyer}. الفاتورة خالصة.`);
    pendingOpen = id;
  } catch (e) {
    err.textContent = errMsg(e);
    btn.disabled = false; btn.textContent = 'تسجيل البيع';
  }
}

    body.innerHTML = `<div class="sum-card"><span>مجموع الديون على الزبائن</span>${money(st.debt)}</div>` +
      (list.length ? list.map(d => `<button type="button" class="srow" data-buyer="${esc(d.name)}"><span class="avatar" aria-hidden="true">${esc(d.name.charAt(0))}</span>
        <span class="s-main"><b>${esc(d.name)}</b><small>${countAr(d.n, 'فاتورة واحدة غير مسددة', 'فاتورتان غير مسددتين', 'فواتير غير مسددة', 'فاتورة غير مسددة')}</small></span>
        <span class="s-amt debt">${money(d.rem)}</span></button>`).join('')
        : emptyBox(q ? 'لا يوجد زبون بهذا الاسم عليه دين' : 'لا توجد ديون', q ? 'جرّب اسماً آخر.' : 'كل الزبائن سددوا ما عليهم.'));
    return;
  }
  const list = S.sales.filter(s => !q || norm(s.buyer).includes(q));
  if (!list.length) {
    body.innerHTML = q ? emptyBox('لا توجد مبيعات لهذا الاسم', 'جرّب اسماً آخر.') : emptyBox('لم تُسجَّل أي عملية بيع بعد', 'سجّل أول بيع: اسم المشتري، الأصناف، وكم دفع.', S.canWrite ? `<button type="button" class="btn primary" data-goto="sale">بيع جديد</button>` : '');
    return;
  }
  let html = '', curDay = null, groups = [];
  for (const s of list) { const d = dayLabel(s.at); if (d !== curDay) { groups.push({ d, items: [] }); curDay = d; } groups[groups.length - 1].items.push(s); }
  for (const g of groups) {
    const sum = g.items.reduce((a, s) => a + (+s.total || 0), 0);
    html += `<div class="day-h"><span>${esc(g.d)}</span>${money(sum)}</div>`;
    html += g.items.map(s => { const rm = rem(s); return `<button type="button" class="srow" data-sid="${esc(s.id)}">
      <span class="s-main"><b>${esc(s.buyer || 'بدون اسم')}${s.sample ? ' <span class="tag">مثال</span>' : ''}</b><small>فاتورة ${invNo(s)} · ${ftime(s.at)} · ${nItems((s.items || []).length)}</small></span>
      <span class="s-amt">${money(s.total)}${rm > 0.004 ? `<span class="pill debt">باقي <span dir="ltr">${fmt(rm)}</span></span>` : '<span class="pill paid">خالص</span>'}</span></button>`; }).join('');
  }
  body.innerHTML = html;
}

/* ---------- sheets ---------- */
function openSheet(kind, arg) {
  sheetState = { kind, arg }; drawSheet(false);
  if (!sheetState) return;
  $('#sheetWrap').hidden = false; document.body.classList.add('locked');
  $('#sheet').scrollTop = 0;
}
function closeSheet() { sheetState = null; invEdit = null; $('#sheetWrap').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('locked'); }
function drawSheet(preserve) {
  const sh = $('#sheet'); const vals = {};
  if (preserve) $$('input', sh).forEach(i => { if (i.id && i.type !== 'file') vals[i.id] = i.value; });
  SHEETS[sheetState.kind].draw(sh, sheetState.arg);
  if (preserve && sheetState) for (const k in vals) { const el = document.getElementById(k); if (el && sh.contains(el)) el.value = vals[k]; }
}
const head = (title, sub = '') => `<div class="grab" aria-hidden="true"></div><div class="sh-head"><div><h2 id="shTitle">${title}</h2>${sub ? `<p class="muted sm">${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-close aria-label="إغلاق">${ic.x}</button></div>`;

async function addPayment(s, amt) {
  const rm = rem(s);
  if (!(amt > 0)) throw 'اكتب مبلغاً أكبر من صفر.';
  if (amt > rm + 0.004) throw `المبلغ أكبر من الباقي (${fmt(rm)}).`;
  const payments = (s.payments || []).map(x => ({ amt: +x.amt || 0, at: +x.at || 0, ...(x.fix ? { fix: true } : {}) }));
  payments.push({ amt: r2(amt), at: Date.now() });
  await store.update('sales', s.id, { paid: r2((+s.paid || 0) + amt), payments });
}

/* ---------- invoice edit ---------- */
function startInvEdit(s) {
  const orig = {};
  for (const it of (s.items || [])) if (it.pid) orig[it.pid] = r2((orig[it.pid] || 0) + (+it.qty || 0));
  invEdit = { sid: s.id, buyer: String(s.buyer || ''), paid: String(r2(+s.paid || 0)), pickQ: '', seq: 0, orig, lines: [] };
  invEdit.lines = (s.items || []).map(it => ({ k: 'l' + (invEdit.seq++), pid: it.pid || '', name: String(it.name || ''), unit: String(it.unit || ''), cost: +it.cost || 0, qty: String(+it.qty || 0), price: String(+it.price || 0) }));
}
const eAvail = pid => { const p = prod(pid); return p ? r2((+p.qty || 0) + ((invEdit && invEdit.orig[pid]) || 0)) : 0; };
function eLineIssue(l) {
  const q = toNum(l.qty), pr = toNum(l.price);

  if (isNaN(pr) || pr < 0) return { bad: true, msg: 'اكتب سعر الوحدة.' };
  if (l.pid && prod(l.pid)) { const av = eAvail(l.pid); if (q > av + 1e-9) return { bad: true, msg: `الكمية أكبر من المتاح (${fmt(av)}).` }; }
  if (pr < l.cost) return { bad: false, msg: 'تنبيه: سعر البيع أقل من سعر التكلفة.' };
  return null;
}
function eTotals() {

}

async function saveInvEdit() {
  if (!invEdit) return;
  const s = S.sales.find(x => x.id === invEdit.sid); if (!s) { closeSheet(); return; }
  const er = $('#eErr'); er.textContent = '';
  const buyer = invEdit.buyer.trim();
  if (!buyer) { er.textContent = 'اكتب اسم المشتري.'; $('#eBuyer').focus(); return; }
  if (!invEdit.lines.length) { er.textContent = 'أضف صنفاً واحداً على الأقل. لحذف الفاتورة كلها استخدم «حذف عملية البيع».'; return; }
  for (const l of invEdit.lines) { const iss = eLineIssue(l); if (iss && iss.bad) { er.textContent = `${l.name}: ${iss.msg}`; return; } }
  const paidRaw = String(invEdit.paid || '').trim();
  if (paidRaw && (isNaN(toNum(paidRaw)) || toNum(paidRaw) < 0)) { er.textContent = 'اكتب المبلغ المدفوع بالأرقام.'; return; }
  const t = eTotals();
  if (t.paid > t.total + 0.004) { er.textContent = 'المبلغ المدفوع أكبر من إجمالي الفاتورة.'; return; }
  const items = invEdit.lines.map(l => ({ pid: l.pid, name: l.name, unit: l.unit, qty: r2(num0(l.qty)), price: r2(num0(l.price)), cost: r2(l.cost) }));
  const newQ = {}; for (const it of items) if (it.pid) newQ[it.pid] = r2((newQ[it.pid] || 0) + it.qty);
  const oldPaid = r2(+s.paid || 0);
  const payments = (s.payments || []).map(x => ({ amt: +x.amt || 0, at: +x.at || 0, ...(x.fix ? { fix: true } : {}) }));
  if (Math.abs(t.paid - oldPaid) > 0.004) payments.push({ amt: r2(t.paid - oldPaid), at: Date.now(), fix: true });
  const { id: _id, ...rest } = s;
  const data = { ...clone(rest), no: invNo(s), buyer, items, total: t.total, paid: t.paid, payments, edited: Date.now() };
  const orig = invEdit.orig;

    await store.set('sales', s.id, data);
    for (const pid of new Set([...Object.keys(orig), ...Object.keys(newQ)])) {
      const delta = r2((newQ[pid] || 0) - (orig[pid] || 0));
      const p = prod(pid);
      if (p && Math.abs(delta) > 1e-9) await store.update('products', pid, { qty: r2((+p.qty || 0) - delta) });
    }
    invEdit = null; toast('حُفظت تعديلات الفاتورة.');
    if (sheetState) drawSheet(false);
  } catch (e) { er.textContent = errMsg(e); btn.disabled = false; btn.textContent = 'حفظ التعديلات'; }
}

/* ---------- PDF invoice ---------- */
const PW = 1240, PH = 1754, PM = 84, PSC = 1.6;
const PC = { ink: '#181b29', muted: '#5b627e', line: '#dadeea', sunk: '#f0f2f7', zebra: '#f8f9fc', accent: '#26318f', debt: '#b5352b', debtSoft: '#fbe8e5', paid: '#1b6e46', paidSoft: '#e0f1e7' };
const PF = '"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif';
function pT(c, txt, x, y, o = {}) {
  c.font = `${o.w || 400} ${o.size || 24}px ${PF}`; c.fillStyle = o.color || PC.ink;
  c.textAlign = o.align || 'right'; c.direction = o.dir || 'rtl'; c.textBaseline = 'alphabetic';

function pRR(c, x, y, w, h, r, fill) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fillStyle = fill; c.fill();
}
function pWrap(c, txt, maxW, font) {
  c.font = font; const words = String(txt).split(/\s+/).filter(Boolean); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (!cur || c.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function invoiceBlocks(s, mc) {

  const nameW = X.nameR - X.qtyR - 32;

  const B = [];
  B.push({ h: 210, draw(c, y) {

    pT(c, 'فاتورة بيع', L, y + 52, { size: 42, w: 700, color: PC.accent, align: 'left' });

  } });
  B.push({ h: 150, draw(c, y) {
    pRR(c, L, y + 14, R - L, 112, 16, PC.sunk);
    pT(c, 'اسم المشتري', R - 28, y + 54, { size: 22, color: PC.muted });
    pT(c, s.buyer || 'بدون اسم', R - 28, y + 100, { size: 34, w: 700, max: R - L - 420 });
    const st = rm > 0.004 ? ['غير مسددة بالكامل', PC.debt, PC.debtSoft] : ['خالصة', PC.paid, PC.paidSoft];
    c.font = `600 24px ${PF}`; const tw = c.measureText(st[0]).width;
    pRR(c, L + 28, y + 47, tw + 48, 46, 23, st[2]);

  } });
  const thead = { kind: 'thead', keepNext: true, h: 62, draw(c, y) {
    pRR(c, L, y, R - L, 62, 10, PC.accent);
    const o = { size: 22, w: 600, color: '#ffffff', align: 'center' };
    pT(c, '#', C.no, y + 40, o);

      if (it.unit) pT(c, it.unit, X.nameR - 16, y + 44 + (lines.length - 1) * 34 + 32, { size: 20, color: PC.muted, max: nameW });

function parseBackup(text) {

      img: typeof v.img === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v.img) ? v.img : '', at: +v.at || 0, ...(v.sample ? { sample: true } : {}) };
  }
  for (const [k, v] of Object.entries(o.sales)) {
    if (!idOk(k) || !v || typeof v !== 'object') continue;
    const items = (Array.isArray(v.items) ? v.items : []).filter(it => it && typeof it === 'object').map(it => ({ pid: idOk(String(it.pid || '')) ? String(it.pid) : '', name: str(it.name, 200), unit: str(it.unit, 60), qty: r2(+it.qty || 0), price: r2(+it.price || 0), cost: r2(+it.cost || 0) }));
